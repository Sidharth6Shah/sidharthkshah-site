projects:
  - name: Drug–ligand binding affinity predictor
    slug: binding-affinity
    status: live
    featured: true
    year: 2026
    area: Drug discovery
    tags: [Machine learning, Drug discovery]
    summary: >-
      Predicts how strongly a drug binds its target protein. Protein
      sequences go through ESM-2, ligands become molecular graphs, and
      five GNN variants are tested against XGBoost and random forest
      baselines.
    highlights:
      - Trained on 51,784 protein–ligand pairs
      - Splitting by protein cut the generalization gap by 32%
      # Also on your resume: 44% accuracy (62% of state of the art). Add if you want it shown.
    stack: [PyTorch Geometric, ESM-2, RDKit, XGBoost]
    links:
