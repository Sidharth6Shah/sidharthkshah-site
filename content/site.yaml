# ─────────────────────────────────────────────────────────────────────
#  SITE CONTENT: the one place to edit what sidharthkshah.com says
# ─────────────────────────────────────────────────────────────────────
#
#  How this works
#  - The website reads this file directly. Change a word here, push, and
#    the site updates. No other file needs touching for wording changes.
#  - status: live      → shown on the site
#    status: offline   → kept here, hidden from the site
#  - Offline articles also redirect to the homepage, so old links don't
#    show half-finished pages.
#  - Article text lives in its own file (see `file:` on each article).
#    Edit that file to fix the article itself.
#  - Lines starting with # are notes to you. The site ignores them.
#  - Tags must come from the `tags:` list just below, so the filter on the
#    Projects section stays tidy.
#
#  Anything marked "CHECK" was written from memory and should be read
#  over before it goes live.
# ─────────────────────────────────────────────────────────────────────

